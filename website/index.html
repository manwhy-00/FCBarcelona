<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FC Barcelona</title>

    <style>

      .legend-page .legends-cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 25px;
        margin-top: 30px;
        align-items: stretch;
      }

      .legends-page .legend-card {
        padding: 20px;
        background: linear-gradient(145deg, #202039, #151522);
        border: 1px solid rgba(165, 0, 68, 0.6);
        border-radius: 16px;
        overflow: hidden;
      }

      .legends-page .legend-card img {
        width: 100%;
        height: 260px;
        object-fit: cover;
        object-position: center top;
        border-radius: 12px;
        display: block;
        margin: 0 auto 15px;
      }

      .legends-page .legend-card h3 {
        color: #edbbd0;
        font-size: 23px;
        text-align: center;
        margin: 12px 0 18px;
      }


      .legends-page .legend-card p {
        color: #eeeeF5;
        font-size: 15px;
        line-height: 1.7;
        text-align: left;
      }

      @media (max-width: 800px) { 
        .legends-page .legends-cards {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 520px) {
        .legend-page .legends-cards {
          grid-template-columns: 1fr;
        }
      }

      .news-intro {
        text-align: center;
        color: #ddd;
        margin: 15px 10px 30px;
      }

      .news-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
        max-width: 1200px;
        margin: 30px auto;
        padding: 15px;
      }

      .news-card {
        overflow: hidden;
        background: #171827;
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0, 3);
        transition:
          transform 0.3s,
          box-shadow 0.3s;
      }

      .news-card:hover {
        transform: translateY(-7px);
        box-shadow: 0 0 22px rgba(180, 25, 55, 0.5);
      }

      .news-card img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
      }

      .news-info {
        padding: 20px;
      }

      .news-tag {
        color: #ff5368;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
      }

      .news-info h2 {
        margin: 12px 0;
      }

      .news-info p {
        color: #ccc;
        line-height: 1.6;
      }

      @media (max-width: 850px) {
        .news-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 550px) {
        .news-grid {
          grid-template-columns: 1fr;
        }
      }

      .home-section {
        margin: 35px auto;
        padding: 25px;
        max-width: 1100px;
        color: white;
        text-align: center;
        background: rgb(28, 28, 42);
        border-radius: 18px;
      }

      .trophies-preview {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 25px 0;
      }

      .trophy-preview-card {
        padding: 18px 10px;
        background: linear-gradient(145deg, rgb(55, 25, 55), rgb(30, 35, 55));
        border: 1px solid rgb(100, 35, 65);
        border-radius: 12px;
        transition: 0.3s;
      }

      .trophy-preview-card:hover {
        transform: translateY(-4px);
        border-color: rgb(190, 26, 50);
      }

      .trophy-preview-card .trophy-emoji {
        font-size: 32px;
      }

      .trophy-preview-card h3 {
        color: white;
        font-size: 16px;
        margin: 10px 0;
      }

      .trophy-preview-card p {
        color: rgb(210, 210, 220);
        font-size: 13px;
        line-height: 1.5;
        margin: 0;
      }

      .section-btn {
        background: rgb(45, 20, 40);
        color: white;
        border: 1px solid rgb(120, 30, 50);
        padding: 10px 20px;
        border-radius: 25px;
        cursor: pointer;
        transition: 0.3s;
      }

      .section-btn:hover {
        background: rgb(120, 20, 45);
        box-shadow: 0 0 12px rgba(190, 26, 50, 0.5);
      }

      @media (max-width: 600px) {
        .trophies-preview {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .legends-cards {
        display: flex;
        gap: 12px;
        margin: 25px 0;
      }

      .legend-card {
        flex: 1;
        min-width: 0;
        padding: 10px;
        background: rgb(45, 45, 60);
        border-radius: 12px;
        text-align: center;
        transition: 0.3s;
      }

      .legend-card:hover {
        transform: translateY(-5px);
        background: rgb(60, 45, 65);
      }

      .legend-card img {
        width: 100%;
        height: 120px;
        object-fit: cover;
        border-radius: 8px;
      }

      .legend-card h3 {
        color: white;
        font-size: 16px;
        margin: 12px 0 8px;
      }

      .legend-card p {
        color: rgb(210, 210, 220);
        font-size: 13px;
        line-height: 1.4;
      }

      .home {
        text-align: center;
        color: white;
        padding: 40px;
      }

      .home h1 {
        font-size: 50px;
        margin-bottom: 10px;
      }

      .home h2 {
        font-size: 28px;
      }

      .home img {
        width: 80%;
        max-width: 1000px;
        height: 450px;
        object-fit: cover;
        border-radius: 20px;
        margin: 30px auto;
        display: block;
      }

      .home p {
        font-size: 20px;
        max-width: 900px;
        margin: 20px auto;
        line-height: 1.6;
      }

      .neon-btn {
        background: transparent;
        color: #4b0b0b;
        font-size: 24px;
        letter-spacing: 3px;
        text-transform: uppercase;
        padding: 15px 30px;
        border: 2px solid #4b0b0b;
        border-radius: 50px;
        cursor: pointer;
        position: relative;
        transition: all 0.5s ease;
      }

      .neon-btn:hover {
        background: #4b0b0b;
        color: #1a1a1a;

        box-shadow:
          0 0 10px #4b0b0b,
          0 0 30px #4b0b0b,
          0 0 60px #4b0b0b,
          0 0 100px #4b0b0b;
      }

      .center_text {
        text-align: center;
        color: white;
      }

      .tab.active {
        background: rgb(50, 50, 50);
        color: white;
      }

      .tabs {
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      .tab {
        padding: 10px 20px;
        border: 1px solid black;
        background: rgb(110, 110, 110);
        color: rgb(0, 0, 0);
        font-size: 20px;
      }

      .field {
        width: min(700px, 95%);
        min-height: 650px;
        margin: auto;
        padding: 20px 0;
        box-sizing: border-box;
        background: repeating-linear-gradient(
          to bottom,
          #176b48 0px,
          #176b48 60px,
          #1d7952 60px,
          #1d7952 120px
        );
        border: 3px solid white;
        border-radius: 12px;
        position: relative;
      }

      .players {
        min-height: 600px;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        gap: 20px;
      }

      .row {
        display: flex;
        justify-content: space-around;
        align-items: center;
        gap: 5px;
      }

      .player {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
        min-width: 0;
        color: white;
        font-size: 12px;
        font-weight: bold;
        text-align: center;
        transition: transform 0.2s;
      }

      .player:hover .player-info {
        opacity: 1;
        visibility: visible;
        transform: translateX(-50%) translateY(0);
      }

      .player-info h3 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      .player-info p {
        margin: 6px 0;
        font-size: 13px;
        color: #ddd;
      }

      .player img {
        width: 55px;
        height: 55px;
        border: 2px solid white;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 3px 10px #0006;
      }

      .player span {
        margin-top: 6px;
        overflow-wrap: anywhere;
      }

      .player-info {
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: 40px;
        margin-top: 10px;

        width: 200px;
        padding: 18px;

        background: rgb(25, 25, 35);
        color: white;

        border: 2px solid rgb(190, 26, 26);
        border-radius: 15px;

        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.5);

        opacity: 0;
        visibility: hidden;

        transform: translateX(-50%) translateY(-10px);

        transition: 0.25s ease;

        z-index: 100;
      }

      .formation {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .coach {
        width: min(230px, 85%);
        padding: 15px;
        box-sizing: border-box;
        background: #191927;
        color: white;
        border-radius: 15px;
        text-align: center;
      }

      .coach img {
        width: 130px;
        height: 130px;
        border-radius: 12px;
        object-fit: cover;
      }

      @media (max-width: 550px) {
        .field {
          width: 100%;
          min-height: 500px;
        }
        .players {
          min-height: 500px;
          gap: 15px;
        }
        .player img {
          width: 42px;
          height: 42px;
        }
        .player {
          font-size: 10px;
        }
      }

      .barca-ending {
        margin-top: 50px;
        padding: 30px 15px;
        text-align: center;
        border-top: 2px solid #a50044;
        background: linear-gradient(135deg, #101020, #24101f);
        border-radius: 15px;
      }

      .barca-ending h2 {
        color: white;
        font-size: clamp(25px, 4vw, 42px);
        letter-spacing: 3px;
      }

      .barca-ending h3 {
        color: #edbbd0;
        letter-spacing: 3px;
      }

      .barca-ending img {
        width: 75px;
        height: 90px;
        object-fit: contain;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="tabs">
      <button class="tab active neon-btn">Главная</button>
      <button class="tab neon-btn">Легенды клуба</button>
      <button class="tab neon-btn">Трофеи</button>
      <button class="tab neon-btn">Состав</button>
      <button class="tab neon-btn">Громкие новости</button>
    </div>

    <div id="content">Главная страница</div>

    <script src="script.js"></script>
  </body>
</html>
